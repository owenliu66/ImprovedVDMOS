[project]
name = "improved-vdmos"
version = "0.1.0"
description = "Continuous drain-current model for power MOSFETs + datasheet parameter extraction (Improved VDMOS fitter)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]
digitizer = [
    # curve_digitizer: PDF rendering and curve skeletonization
    "pymupdf>=1.24",
    "scikit-image>=0.22",
]

[project.scripts]
vdmos-fit = "vdmos_fit.cli:main"
curve-digitizer = "curve_digitizer.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
